<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pocket Pal: The Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'VT323', monospace;
        font-size: 20px;
        line-height: 1.25;
        background-color: #1a0d1f;
        color: #fefefe;
        image-rendering: pixelated;
        -webkit-font-smoothing: none;
        -moz-osx-font-smoothing: none;
      }

      h1, h2, h3, .pixel-display, button {
        font-family: 'Press Start 2P', system-ui, sans-serif;
        letter-spacing: 0;
      }

      img {
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
      }

      /* Pixel-style buttons + cards: solid colour, hard 4px black shadow */
      .pixel-card {
        background: #fefefe;
        border: 3px solid #1a0d1f;
        box-shadow: 6px 6px 0 0 #1a0d1f;
        border-radius: 0;
        color: #1a0d1f;
      }
      .pixel-btn {
        font-family: 'Press Start 2P', system-ui, sans-serif;
        font-size: 11px;
        letter-spacing: 0.05em;
        background: #ec94cc;
        color: #1a0d1f;
        border: 3px solid #1a0d1f;
        box-shadow: 5px 5px 0 0 #1a0d1f;
        padding: 0.75rem 1rem;
        border-radius: 0;
        transition: transform 0.1s ease, box-shadow 0.1s ease;
        cursor: pointer;
        text-transform: uppercase;
      }
      .pixel-btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 7px 7px 0 0 #1a0d1f;
      }
      .pixel-btn:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 0 #1a0d1f;
      }
      .pixel-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        box-shadow: 5px 5px 0 0 #1a0d1f;
        transform: none;
      }
      .pixel-btn.alt { background: #6be8c5; }
      .pixel-btn.warn { background: #ffd166; }
      .pixel-btn.danger { background: #ff5d73; color: #fefefe; }
      .pixel-btn.ghost { background: #fefefe; }

      .pixel-bg {
        background-color: #efe5d2;
        background-image:
          linear-gradient(45deg, #ec94cc11 25%, transparent 25%, transparent 75%, #ec94cc11 75%, #ec94cc11),
          linear-gradient(45deg, #ec94cc11 25%, transparent 25%, transparent 75%, #ec94cc11 75%, #ec94cc11);
        background-size: 32px 32px;
        background-position: 0 0, 16px 16px;
      }

      .scanlines {
        position: relative;
      }
      .scanlines::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          0deg,
          rgba(0,0,0,0.04) 0px,
          rgba(0,0,0,0.04) 1px,
          transparent 1px,
          transparent 3px
        );
        mix-blend-mode: multiply;
      }

      @media print {
        body {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        .no-print {
          display: none !important;
        }
        .print-container {
          display: block !important;
          width: 100%;
          margin: 0;
          padding: 0;
          box-shadow: none;
          border: none;
        }
        .print-page-break {
          page-break-after: always;
        }
      }
    </style>
    <script type="module" crossorigin src="/game/assets/index-DjMqb94J.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
